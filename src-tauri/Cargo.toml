[package]
name = "psigestion"
version = "0.2.0"
description = "Agenda y finanzas para psicólogos"
authors = ["Federico Arrieta"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "psigestion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Contraseña: derivación de claves (Argon2id) y cifrado de la clave de datos.
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
tokio = { version = "1", features = ["time"] }
# La misma versión de sqlx que usa tauri-plugin-sql, para correr transacciones sobre su conexión.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "migrate"] }
# SQLCipher en lugar de SQLite común, para que la base quede cifrada (incluye OpenSSL compilado).
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri-plugin-log = "2"
log = "0.4"
rust_xlsxwriter = "0.102.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
