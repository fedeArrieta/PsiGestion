# Propone actualizaciones de dependencias una vez por mes, agrupadas en un solo PR por tipo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    ignore:
      # sqlx tiene que ser la misma versión que usa tauri-plugin-sql (hoy 0.8):
      # se actualiza cuando lo haga el plugin, no antes.
      - dependency-name: sqlx
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]
